name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci || bun install
      - run: npm run lint --if-present || bun run lint || true
      - run: npm run build --if-present || bun run build || true
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust-core/Cargo.toml
