name: Docker build validation

on:
  push:
    branches: [main, master]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - bun.lock
      - next.config.ts
      - prisma/**
      - src/**
      - public/**
      - .github/workflows/docker-build.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - bun.lock
      - next.config.ts
      - prisma/**
      - src/**
      - public/**
      - .github/workflows/docker-build.yml

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build staging image (no push or deployment)
        run: docker build --pull --target production-runtime -t agentswarm:ci .
